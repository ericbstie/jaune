name: Checks

on:
  push:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          version: "2026.9.2"
      - run: mise run install
      - name: Start test PostgreSQL
        run: |
          brew install postgresql@17
          brew services start postgresql@17
          "$(brew --prefix postgresql@17)/bin/createdb" jaune_test
      - name: Diagnose formatting
        run: |
          mise run format
          git diff
      - run: mise run checks
        env:
          TEST_DATABASE_URL: postgres://localhost:5432/jaune_test
