[tools]
bun = "1.4.2"
"github:cli/cli" = "2.100.0"
"npm:@tailwindcss/cli" = "4.3.3"
"github:tauri-apps/tauri" = "tauri-cli-v2.11.4"
"npm:oxfmt" = "0.66.0"
"npm:oxlint" = "1.81.0"
"npm:oxlint-tsgolint" = "7.0.2001"
"npm:typescript" = "7.0.2"
rust = { version = "1.98.1", profile = "minimal", components = [
  "rustfmt",
  "clippy",
] }
taplo = "0.10.0"
node = "24.20.0"

[env]
BUN_PUBLIC_SERVER_URL = "http://localhost:3000"
BUN_PUBLIC_BUILD_MODE = "production"
BUN_PUBLIC_MOCK_AUTH = "false"
RUST_BACKTRACE = "1"
CARGO_TERM_COLOR = "always"

[tasks.install]
run = "bun install --frozen-lockfile"

[tasks."web:css"]
run = "cd apps/client && tailwindcss -i src/styles.css -o .generated/styles.css --minify"

[tasks."web:css:watch"]
run = "cd apps/client && tailwindcss -i src/styles.css -o .generated/styles.css --watch"

[tasks."web:serve"]
run = "cd apps/client && bun --hot scripts/dev.ts"

[tasks."web:dev"]
depends = ["web:css"]
run = "mise run web:css:watch ::: web:serve"

[tasks."web:build"]
depends = ["web:css"]
run = "cd apps/client && bun build src/index.html --outdir dist --production --env BUN_PUBLIC_*"

[tasks."web:build:test"]
depends = ["web:css"]
run = "cd apps/client && BUN_PUBLIC_BUILD_MODE=test BUN_PUBLIC_MOCK_AUTH=true bun build src/index.html --outdir dist --production --env BUN_PUBLIC_*"

[tasks.dev]
run = "cd apps/client && cargo tauri dev"

[tasks.build]
run = "cd apps/client && bun scripts/build.ts"

[tasks.release]
run = "cd apps/client && cargo tauri build --no-bundle"

[tasks.format]
run = [
  "cd apps/client && oxfmt --write .",
  "cd apps/server && oxfmt --write .",
  "taplo fmt mise.toml mise.android.toml apps/client/src-tauri/Cargo.toml",
  "cargo fmt --manifest-path apps/client/src-tauri/Cargo.toml",
]

[tasks.checks]
depends = ["web:build"]
run = [
  "cd apps/client && oxfmt --check .",
  "cd apps/server && oxfmt --check .",
  "taplo fmt --check mise.toml mise.android.toml apps/client/src-tauri/Cargo.toml",
  "cd apps/client && tsc --noEmit",
  "cd apps/server && tsc --noEmit",
  "cd apps/client && oxlint --deny-warnings --report-unused-disable-directives-severity error src scripts tests",
  "cd apps/server && oxlint --deny-warnings --report-unused-disable-directives-severity error src tests",
  "bun audit",
  "cd apps/server && bun test tests",
  "cargo fmt --manifest-path apps/client/src-tauri/Cargo.toml --check",
  "cargo clippy --manifest-path apps/client/src-tauri/Cargo.toml --all-targets -- -D warnings",
  "cargo test --manifest-path apps/client/src-tauri/Cargo.toml",
  "cd apps/client && bun test tests",
]

[tasks."test:gui"]
depends = ["web:build"]
run = "cd apps/client && bun test tests"

[tasks."server:dev"]
run = "cd apps/server && bun --watch src/index.ts"

[tasks."test:server"]
run = "cd apps/server && bun test tests"
